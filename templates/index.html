<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Socratic Debugger</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    textarea { width: 100%; height: 300px; font-family: monospace; font-size: 14px; }
    button { font-size: 16px; padding: 8px 18px; margin: 10px 8px 10px 0; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; }
    .hint { background: #eef6ff; border-left: 4px solid #3a7bd5; padding: 10px; margin: 8px 0; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Socratic Debugger</h1>
  <p>Paste your broken Python code. You will get hints, not answers.</p>

  <textarea id="code" placeholder="Paste your Python code here..."></textarea>
  <br>
  <button id="helpBtn" onclick="helpMe()">Help me</button>
  <button id="stuckBtn" onclick="stillStuck()" disabled>Still stuck</button>
  <span id="status"></span>

  <h2>Output</h2>
  <pre id="output">(run your code to see output)</pre>

  <h2>Hints</h2>
  <div id="hints"></div>

  <script>
    let level = 0;
    let lastOutput = "";

    async function postJson(url, data) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return res.json();
    }

    async function helpMe() {
      const code = document.getElementById("code").value;
      document.getElementById("hints").innerHTML = "";
      setStatus("Running your code...");

      const result = await postJson("/run", { code: code });
      lastOutput = result.stdout + result.stderr;
      document.getElementById("output").textContent = lastOutput || "(no output)";

      level = 1;
      await getHint();
    }

    async function stillStuck() {
      if (level >= 3) return;
      level = level + 1;
      await getHint();
    }

    async function getHint() {
      const code = document.getElementById("code").value;
      setStatus("Thinking of a hint...");
      setButtons(false);

      const result = await postJson("/hint", { code: code, output: lastOutput, level: level });

      const box = document.createElement("div");
      if (result.error) {
        box.className = "error";
        box.textContent = result.error;
        level = level - 1;
      } else {
        box.className = "hint";
        box.textContent = "Hint " + level + " of 3: " + result.hint;
      }
      document.getElementById("hints").appendChild(box);

      setStatus("");
      setButtons(true);
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function setButtons(enabled) {
      document.getElementById("helpBtn").disabled = !enabled;
      document.getElementById("stuckBtn").disabled = !enabled || level < 1 || level >= 3;
    }
  </script>
</body>
</html>
